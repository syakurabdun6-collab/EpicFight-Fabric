name: Build Epic Fight Fabric

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Epic Fight source
        run: |
          echo "=== SOURCE ZIP FILES ==="
          ls -lh *.zip || true

      - name: Extract Epic Fight source
        run: |
          mkdir -p source-extracted
          unzip -o EpicFight-Code.zip -d source-extracted

      - name: Analyze all Epic Fight source
        run: |
          echo "=== TOTAL JAVA FILES ==="
          find source-extracted -name "*.java" | wc -l

          echo "=== JAVA FILE LIST ==="
          find source-extracted -name "*.java" | head -n 100

          echo "=== FORGE IMPORTS ==="
          grep -RhnE "net\.minecraftforge|net\.minecraft\.forge" source-extracted --include="*.java" | head -n 100 || true

          echo "=== MIXIN FILES ==="
          find source-extracted -iname "*mixin*.java"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Show generated JAR files
        run: |
          echo "=== GENERATED JAR FILES ==="
          find build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EpicFight-Fabric
          path: build/libs/*.jar
          if-no-files-found: error
