
name: Build Epic Fight Fabric

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Show generated JAR files
        run: find build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EpicFight-Fabric
          path: build/libs/*.jar
          if-no-files-found: error
